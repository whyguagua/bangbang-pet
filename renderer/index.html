<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>邦邦桌宠</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none; user-select: none;
      cursor: default;
    }
    /*
     * 窗口本身就是精灵的方框（大小 = 精灵尺寸，没有留白），
     * 精灵固定贴在窗口左上角 —— 位置完全由"主进程每帧挪窗口"决定。
     * 页面内不再做任何位移补偿，所以不存在「窗口跳一下、图内再补回来」的抖动。
     */
    #pet {
      position: absolute;
      left: 0; top: 0;
      width: 160px; height: 160px;
      transform-origin: 50% 50%;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      pointer-events: auto;
      outline: none;
      display: block;
    }
    body.click-through { pointer-events: none; }
    body.click-through #pet { pointer-events: none; }
  </style>
</head>
<body>
  <img id="pet" alt="" draggable="false">
  <script src="renderer.js"></script>
</body>
</html>
